# Keeps the free Supabase project from being paused (it pauses after ~7 days without activity).
# Runs every 3 days and also on demand (Actions tab -> "Supabase keep-alive" -> Run workflow).
#
# One-time setup: GitHub repo -> Settings -> Secrets and variables -> Actions -> New repository secret
#   SUPABASE_URL        e.g. https://abcdxyz.supabase.co
#   SUPABASE_ANON_KEY   the "anon public" key (Project Settings -> API)
name: Supabase keep-alive

on:
  schedule:
    - cron: "0 3 */3 * *"   # 03:00 UTC every 3rd day of the month
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Add the SUPABASE_URL and SUPABASE_ANON_KEY repository secrets first."
            exit 1
          fi
          # A real read on the products table counts as database activity.
          status=$(curl -sS -o /tmp/response.json -w "%{http_code}" \
            --retry 3 --retry-delay 10 --max-time 30 \
            "$SUPABASE_URL/rest/v1/products?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP status: $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Supabase answered with HTTP $status"
            cat /tmp/response.json
            exit 1
          fi
          echo "Supabase is awake."
